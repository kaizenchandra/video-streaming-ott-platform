{
  "openapi": "3.1.0",
  "info": {
    "title": "OTT Insights API",
    "version": "0.1.0"
  },
  "servers": [
    {
      "url": "http://localhost:8089"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Consent": {
        "type": "object",
        "properties": {
          "analytics": {
            "type": "boolean"
          },
          "experiments": {
            "type": "boolean"
          },
          "analyticsSince": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "experimentsSince": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "ConsentUpdate": {
        "type": "object",
        "properties": {
          "analytics": {
            "type": "boolean"
          },
          "experiments": {
            "type": "boolean"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
          "version",
          "analytics",
          "experiments"
        ]
      },
      "Sample": {
        "type": "object",
        "properties": {
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string",
            "enum": [
              "PLAY_STARTED",
              "PLAY_PAUSED",
              "PLAY_COMPLETED",
              "BUFFER_STARTED",
              "BUFFER_ENDED",
              "QUALITY_CHANGED",
              "SEARCH",
              "PLAY_FAILED"
            ]
          },
          "occurredAt": {
            "type": "string",
            "format": "date-time"
          },
          "sequence": {
            "type": "integer",
            "minimum": 1,
            "maximum": 2147483647
          },
          "startupMillis": {
            "type": "integer",
            "minimum": 0,
            "maximum": 120000
          },
          "bufferMillis": {
            "type": "integer",
            "minimum": 0,
            "maximum": 60000
          },
          "playedMillis": {
            "type": "integer",
            "minimum": 0,
            "maximum": 60000
          },
          "bitrateKbps": {
            "type": "integer",
            "minimum": 0,
            "maximum": 200000
          },
          "regionHint": {
            "type": "string",
            "pattern": "^([A-Z]{2}|UNKNOWN)$"
          },
          "deviceFamily": {
            "type": "string",
            "enum": [
              "TV",
              "MOBILE",
              "DESKTOP",
              "TABLET",
              "OTHER"
            ]
          },
          "cdn": {
            "type": "string",
            "enum": [
              "CLOUDFRONT",
              "AKAMAI",
              "FASTLY",
              "OTHER"
            ]
          },
          "resolution": {
            "type": "string",
            "enum": [
              "SD",
              "HD",
              "FHD",
              "UHD",
              "UNKNOWN"
            ]
          },
          "failureCode": {
            "type": "string",
            "enum": [
              "NONE",
              "NETWORK",
              "DECODE",
              "MANIFEST",
              "DRM",
              "OTHER"
            ]
          }
        },
        "required": [
          "eventId",
          "kind",
          "occurredAt",
          "sequence",
          "regionHint",
          "deviceFamily",
          "cdn",
          "resolution",
          "failureCode"
        ]
      },
      "Batch": {
        "type": "object",
        "properties": {
          "profileId": {
            "type": "string",
            "format": "uuid"
          },
          "deviceId": {
            "type": "string",
            "format": "uuid"
          },
          "playbackToken": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 4096
          },
          "samples": {
            "type": "array",
            "minItems": 1,
            "maxItems": 20,
            "items": {
              "$ref": "#/components/schemas/Sample"
            }
          }
        },
        "required": [
          "profileId",
          "deviceId",
          "samples"
        ]
      },
      "Receipt": {
        "type": "object",
        "properties": {
          "accepted": {
            "type": "integer",
            "minimum": 0
          },
          "duplicate": {
            "type": "integer",
            "minimum": 0
          },
          "ignored": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Experiment": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string",
            "maxLength": 100
          },
          "feature": {
            "type": "string",
            "enum": [
              "HOME_RAILS",
              "SEARCH_PRESENTATION",
              "AD_PRESENTATION"
            ]
          },
          "enabled": {
            "type": "boolean"
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          },
          "control": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100
          },
          "variantA": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100
          },
          "variantB": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100
          },
          "version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "ExperimentCreate": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "feature": {
            "type": "string",
            "enum": [
              "HOME_RAILS",
              "SEARCH_PRESENTATION",
              "AD_PRESENTATION"
            ]
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          },
          "control": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100
          },
          "variantA": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100
          },
          "variantB": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100
          }
        },
        "required": [
          "name",
          "feature",
          "startsAt",
          "endsAt",
          "control",
          "variantA",
          "variantB"
        ]
      },
      "Configuration": {
        "type": "object",
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "enabled": {
            "type": "boolean"
          },
          "control": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100
          },
          "variantA": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100
          },
          "variantB": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100
          }
        },
        "required": [
          "version",
          "enabled",
          "control",
          "variantA",
          "variantB"
        ]
      },
      "Assignment": {
        "type": "object",
        "properties": {
          "experimentId": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "minimum": 0
          },
          "variant": {
            "type": "string",
            "enum": [
              "CONTROL",
              "VARIANT_A",
              "VARIANT_B"
            ]
          },
          "reason": {
            "type": "string"
          }
        }
      },
      "Problem": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 100,
            "maximum": 599
          },
          "detail": {
            "type": "string"
          },
          "code": {
            "type": "string"
          }
        }
      }
    }
  },
