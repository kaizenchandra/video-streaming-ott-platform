              },
              "required": [
                "name",
                "items"
              ]
            }
          }
        },
        "required": [
          "degraded",
          "rails"
        ]
      },
      "Personalization": {
        "type": "object",
        "properties": {
          "enabled": {
            "type": "boolean"
          },
          "version": {
            "type": "integer"
          },
          "enabledSince": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
