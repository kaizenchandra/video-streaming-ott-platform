        "required": [
          "enabled",
          "version",
          "enabledSince"
        ]
      },
      "RecommendationRail": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          },
          "basis": {
            "type": "string",
            "description": "Shows opt-in-playback-starts or recent-fallback explicitly; not total audience or proven viewing."
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Hit"
            }
