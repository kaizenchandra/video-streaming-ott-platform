        "type": "object",
        "properties": {
          "rails": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RecommendationRail"
            }
          },
          "personalizationEnabled": {
            "type": "boolean",
            "description": "Profile preference is opted in."
          },
          "personalized": {
            "type": "boolean",
            "description": "At least one nonempty because-you-watched rail was actually applied."
          }
        },
        "required": [
          "rails",
          "personalizationEnabled",
          "personalized"
        ]
      }
    }
