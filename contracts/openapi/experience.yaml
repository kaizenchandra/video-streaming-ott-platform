{
  "openapi": "3.1.0",
  "info": {
    "title": "OTT Watch State",
    "version": "0.1.0",
    "description": "Profile-owned watch state. Current device-bound playback/offline grant required for progress; server epochs order devices, sequence orders rewinds within a session. Duplicate UUIDs or sequences with changed payloads are conflicts. Duration is advisory client telemetry, not billing or authoritative media duration."
  },
  "servers": [
    {
      "url": "http://localhost:8087"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Observation": {
        "type": "object",
        "properties": {
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "contentId": {
            "type": "string",
            "format": "uuid"
          },
          "deviceId": {
            "type": "string",
            "format": "uuid"
          },
          "grantToken": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096
          },
          "offline": {
            "type": "boolean",
            "default": false
          },
          "sequence": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "positionMillis": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "durationMillis": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 86400000
          }
        },
        "required": [
          "eventId",
          "contentId",
          "deviceId",
          "grantToken",
          "sequence",
          "positionMillis",
          "durationMillis"
        ],
        "additionalProperties": false
      },
      "Progress": {
        "type": "object",
        "properties": {
          "contentId": {
            "type": "string",
            "format": "uuid"
          },
          "sessionId": {
            "type": "string",
            "format": "uuid"
          },
          "epoch": {
            "type": "integer",
            "format": "int64"
          },
          "sequence": {
            "type": "integer",
            "format": "int64"
          },
          "positionMillis": {
            "type": "integer",
            "format": "int64"
          },
          "durationMillis": {
            "type": "integer",
            "format": "int64"
          },
          "version": {
            "type": "integer",
            "format": "int64"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "contentId",
          "sessionId",
          "epoch",
          "sequence",
          "positionMillis",
          "durationMillis",
          "version",
          "updatedAt"
        ],
        "additionalProperties": false
      },
      "Collection": {
        "type": "object",
        "properties": {
          "contentId": {
            "type": "string",
            "format": "uuid"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "contentId",
          "createdAt"
        ],
        "additionalProperties": false
      },
      "History": {
        "type": "object",
        "properties": {
          "sessionId": {
            "type": "string",
            "format": "uuid"
          },
          "contentId": {
            "type": "string",
            "format": "uuid"
          },
          "startedAt": {
            "type": "string",
            "format": "date-time"
          },
          "lastAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "sessionId",
          "contentId",
          "startedAt",
          "lastAt"
        ],
        "additionalProperties": false
      },
      "Reaction": {
        "type": "object",
        "properties": {
          "contentId": {
            "type": "string",
            "format": "uuid"
          },
          "rating": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 1,
            "maximum": 5
          },
          "reaction": {
            "type": [
              "string",
              "null"
            ],
            "enum": [
              "LIKE",
              "DISLIKE",
              null
            ]
          },
          "version": {
            "type": "integer",
            "format": "int64"
          }
        },
        "required": [
          "contentId",
          "rating",
          "reaction",
          "version"
        ],
        "additionalProperties": false
      },
      "Receipt": {
        "type": "object",
        "properties": {
          "accepted": {
            "type": "boolean"
          },
          "duplicate": {
            "type": "boolean"
          },
          "progress": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Progress"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "accepted",
          "duplicate",
          "progress"
        ],
        "additionalProperties": false
      },
      "Stars": {
        "type": "object",
        "properties": {
          "rating": {
            "type": "integer",
            "minimum": 1,
            "maximum": 5
          }
        },
        "required": [
          "rating"
        ],
        "additionalProperties": false
      },
      "Thumb": {
        "type": "object",
        "properties": {
          "reaction": {
            "type": "string",
            "enum": [
              "LIKE",
              "DISLIKE"
            ]
          }
        },
        "required": [
          "reaction"
        ],
        "additionalProperties": false
      },
      "Problem": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "detail": {
            "type": "string"
          },
          "code": {
            "type": "string"
          }
        },
        "required": [
          "status",
          "code"
        ],
        "additionalProperties": false
      },
      "ProgressPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Progress"
            }
          },
          "nextCursor": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "items",
          "nextCursor"
        ],
        "additionalProperties": false
      },
      "CollectionPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Collection"
            }
          },
          "nextCursor": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "items",
          "nextCursor"
        ],
        "additionalProperties": false
      },
      "HistoryPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/History"
            }
          },
          "nextCursor": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "items",
          "nextCursor"
        ],
        "additionalProperties": false
      },
      "Hit": {
        "type": "object",
        "properties": {
          "contentId": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "format": "int64"
          },
          "locale": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "synopsis": {
            "type": "string"
          },
          "contentType": {
            "type": "string"
          },
          "maturity": {
            "type": "integer"
          },
          "genres": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "actors": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "releaseDate": {
            "type": [
              "string",
              "null"
            ],
            "format": "date"
          },
          "publishedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "contentId",
          "version",
          "locale",
          "title",
          "synopsis",
          "contentType",
          "maturity",
          "genres",
          "actors",
          "releaseDate",
          "publishedAt"
        ]
      },
      "SearchPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Hit"
            }
          },
          "nextOffset": {
            "type": [
              "integer",
              "null"
            ]
          }
        },
        "required": [
          "items",
          "nextOffset"
        ]
      },
      "Home": {
        "type": "object",
        "properties": {
          "degraded": {
            "type": "boolean"
          },
          "rails": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "name": {
                  "type": "string"
                },
                "items": {
                  "type": "array",
                  "items": {
