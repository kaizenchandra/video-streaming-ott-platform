            }
          },
          "400": {
            "description": "Invalid request"
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Eligibility or geo denied"
          },
          "409": {
            "description": "Capacity, idempotency or session conflict"
          },
          "503": {
            "description": "Dependency unavailable; no authorization issued"
          }
        },
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "token": {
                    "type": "string",
                    "maxLength": 4096
                  },
                  "deviceId": {
                    "type": "string",
                    "format": "uuid"
                  }
                },
                "required": [
                  "token",
                  "deviceId"
                ]
              }
            }
          }
        },
        "description": "Requires playback.internal. Country comes from the saved geo-validated session; expiry is the exact supplied token ledger expiry. Existing generic/offline context contracts unchanged."
      }
    }
  }
