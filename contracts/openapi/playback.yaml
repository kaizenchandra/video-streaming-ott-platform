    "/v1/live/events/{event}/playback": {
      "post": {
        "summary": "Authorize live/DVR/replay through the same VOD stream quota and owner checks",
        "responses": {
          "200": {
            "description": "Authorized result"
          },
          "400": {
            "description": "Invalid request"
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Eligibility or geo denied"
          },
          "409": {
            "description": "Capacity, idempotency or session conflict"
          },
          "503": {
            "description": "Dependency unavailable; no authorization issued"
          }
        },
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "profileId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "deviceId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "country": {
                    "type": "string",
                    "pattern": "^[A-Z]{2}$"
                  },
                  "mode": {
                    "type": "string",
                    "enum": [
                      "LIVE",
                      "DVR",
                      "REPLAY"
                    ]
                  },
                  "seekAt": {
                    "type": "string",
                    "format": "date-time"
                  }
                },
                "required": [
                  "profileId",
                  "deviceId",
                  "country",
                  "mode"
                ]
              }
            }
          }
        },
        "parameters": [
          {
            "name": "event",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-Geo-Assertion",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-Profile-Authorization",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{43}$"
            },
            "description": "Required for an adult profile where Member account parental locking is enabled; grants expire30min and bind profile/device/PIN revision."
          }
        ],
        "description": "Fresh source proof bounds LIVE/DVR grants to at most 30 sec. Failover changes prefix and requires a new session. DVR requires seekAt; LIVE/REPLAY forbid seekAt. X-Geo-Assertion binds trusted edge region to viewer/device. Commercial DRM/CDN acceptance requires provider integration; local adapter is clear media."
      }
    },
    "/internal/v1/playback/ads/context": {
      "post": {
        "summary": "Validated current online grant context for optional advertising",
        "responses": {
          "200": {
            "description": "Authorized result",
            "content": {
              "application/json": {
                "schema": {
