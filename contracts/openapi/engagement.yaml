    "/v1/ads/decision": {
      "post": {
        "operationId": "decideAd",
        "description": "Current online playback ownership, trusted session country and current plan/profile policy. Kids excluded, contextual targeting only. Issued decisions count toward account/campaign/UTC-day cap despite missing reports. Pending claim returns 409; provider failure explicitly skips. SSAI authorizes an external stitcher; Java never serves media. Client-side decisions/reports are advisory and not billing evidence.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AdResult"
                }
              }
            }
          },
          "400": {
            "description": "Rejected or unavailable; clients may skip optional ads on provider/platform failure",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "Rejected or unavailable; clients may skip optional ads on provider/platform failure",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "Rejected or unavailable; clients may skip optional ads on provider/platform failure",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "Rejected or unavailable; clients may skip optional ads on provider/platform failure",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "Rejected or unavailable; clients may skip optional ads on provider/platform failure",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "429": {
            "description": "Rejected or unavailable; clients may skip optional ads on provider/platform failure",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "Rejected or unavailable; clients may skip optional ads on provider/platform failure",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{8,128}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "profileId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "deviceId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "playbackToken": {
                    "type": "string",
                    "maxLength": 8192
                  },
                  "placement": {
                    "type": "string",
                    "enum": [
                      "PRE_ROLL",
                      "MID_ROLL",
                      "POST_ROLL"
                    ]
                  },
                  "adapter": {
                    "type": "string",
                    "enum": [
                      "CSAI",
                      "SSAI"
                    ]
                  }
                },
                "required": [
                  "profileId",
                  "deviceId",
                  "playbackToken",
                  "placement",
                  "adapter"
                ]
              }
            }
          }
        }
      }
    },
    "/v1/ads/events": {
      "post": {
        "operationId": "reportAdEvent",
        "description": "quartile=0 impression, 1..4 quartiles. Same event UUID/different body conflicts; duplicate semantic quartile creates no second event. Independent out-of-order quartiles accepted only within issued interval, plausible elapsed duration, clock+5 sec and expiry+60 sec report delay. Current saved-session ownership required. Receipt/event/version/outbox commit together.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
