{
  "openapi": "3.1.0",
  "info": {
    "title": "OTT Engagement API",
    "version": "0.1.0"
  },
  "servers": [
    {
      "url": "http://localhost:8088"
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Campaign": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "country": {
            "type": "string",
            "pattern": "^[A-Z]{2}$"
          },
          "maturity": {
            "type": "integer",
            "minimum": 0,
            "maximum": 18
          },
          "placement": {
            "type": "string",
            "enum": [
              "PRE_ROLL",
              "MID_ROLL",
              "POST_ROLL"
            ]
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          },
          "dailyCap": {
            "type": "integer",
            "minimum": 1,
            "maximum": 20
          },
          "creativeUrl": {
            "type": "string",
            "format": "uri",
            "maxLength": 2048
          },
          "durationMillis": {
            "type": "integer",
            "minimum": 1000,
            "maximum": 120000
          },
          "enabled": {
            "type": "boolean"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
          "id",
          "name",
          "country",
          "maturity",
          "placement",
          "startsAt",
          "endsAt",
          "dailyCap",
          "creativeUrl",
          "durationMillis",
          "enabled",
          "version"
        ]
      },
      "AdDecision": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "accountId": {
            "type": "string",
            "format": "uuid"
          },
          "profileId": {
            "type": "string",
            "format": "uuid"
          },
          "deviceId": {
            "type": "string",
            "format": "uuid"
          },
          "sessionId": {
            "type": "string",
            "format": "uuid"
          },
          "campaignId": {
            "type": "string",
            "format": "uuid"
          },
          "state": {
            "type": "string",
            "enum": [
              "ACTIVE"
            ]
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "adapter": {
            "type": "string",
            "enum": [
              "CSAI",
              "SSAI"
            ]
          },
          "mediaUrl": {
            "type": "string",
            "format": "uri"
          },
          "durationMillis": {
            "type": "integer"
          },
          "version": {
            "type": "integer"
          },
          "issuedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "accountId",
          "profileId",
          "deviceId",
          "sessionId",
          "campaignId",
          "state",
          "expiresAt",
          "adapter",
          "mediaUrl",
          "durationMillis",
          "version",
          "issuedAt"
        ]
      },
      "AdResult": {
        "type": "object",
        "properties": {
          "decision": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/AdDecision"
              },
              {
                "type": "null"
              }
            ]
          },
          "reason": {
            "type": "string",
            "enum": [
              "FILLED",
              "KIDS_EXCLUDED",
              "AD_FREE_OR_INACTIVE",
              "NO_FILL_OR_CAPPED",
              "PROVIDER_SKIPPED",
              "NOT_ISSUED"
            ]
          },
          "duplicate": {
            "type": "boolean"
          }
        },
        "required": [
          "decision",
          "reason",
          "duplicate"
        ]
      },
      "AdReceipt": {
        "type": "object",
        "properties": {
          "duplicate": {
            "type": "boolean"
          },
          "version": {
            "type": "integer"
          }
        },
        "required": [
          "duplicate",
          "version"
        ]
      },
      "Problem": {
        "type": "object",
        "properties": {
          "status": {
            "type": "integer"
          },
          "code": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "detail": {
            "type": "string"
          }
        },
        "required": [
          "status",
          "code"
        ]
      },
      "NotificationPreference": {
        "type": "object",
        "properties": {
          "channel": {
            "type": "string",
            "enum": [
              "IN_APP",
              "EMAIL",
              "SMS",
              "PUSH"
            ]
          },
          "enabled": {
            "type": "boolean"
          },
          "version": {
            "type": "integer"
          },
          "contactVerified": {
            "type": "boolean"
          }
        },
        "required": [
          "channel",
          "enabled",
          "version",
          "contactVerified"
        ]
      },
      "Reminder": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string",
            "enum": [
              "CONTENT",
              "LIVE"
            ]
          },
          "targetId": {
            "type": "string",
            "format": "uuid"
          },
          "channel": {
            "type": "string",
            "enum": [
              "IN_APP",
              "EMAIL",
              "SMS",
              "PUSH"
            ]
          },
          "dueAt": {
            "type": "string",
            "format": "date-time"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "state": {
            "type": "string",
            "enum": [
              "WAITING",
              "REQUESTED",
              "CANCELLED",
              "EXPIRED"
            ]
          }
        },
        "required": [
          "id",
          "kind",
          "targetId",
          "channel",
          "dueAt",
          "expiresAt",
          "state"
        ]
      },
      "Notice": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "template": {
            "type": "string",
            "enum": [
              "CONTENT_REMINDER",
              "LIVE_STARTED",
              "PAYMENT_FAILED"
            ]
          },
          "targetId": {
            "type": "string",
            "format": "uuid"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "readAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "template",
          "targetId",
          "createdAt",
          "readAt"
        ]
      }
    }
  },
  "paths": {
    "/v1/admin/ads/campaigns": {
