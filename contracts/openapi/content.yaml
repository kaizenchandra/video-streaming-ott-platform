{
  "openapi": "3.1.0",
  "info": {
    "title": "OTT Content API",
    "version": "0.1.0"
  },
  "servers": [
    {
      "url": "http://localhost:8082"
    }
  ],
  "components": {
    "schemas": {
      "Item": {
        "type": "object",
        "required": [
          "id",
          "type",
          "maturity",
          "state",
          "version",
          "locale",
          "title",
          "synopsis"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "parentId": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "type": {
            "type": "string",
            "enum": [
              "MOVIE",
              "SERIES",
              "SEASON",
              "EPISODE",
              "SPORT"
            ]
          },
          "maturity": {
            "type": "integer",
            "minimum": 0,
            "maximum": 18
          },
          "state": {
            "type": "string",
            "enum": [
              "DRAFT",
              "REVIEW",
              "PUBLISHED"
            ]
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "locale": {
            "type": "string",
            "maxLength": 35
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "synopsis": {
            "type": "string",
            "maxLength": 4000
          }
        }
      },
      "Rights": {
        "type": "object",
        "required": [
          "id",
          "contentId",
          "country",
          "startAt",
          "endAt",
          "offlineAllowed",
          "version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "contentId": {
            "type": "string",
            "format": "uuid"
          },
          "country": {
            "type": "string",
            "pattern": "^[A-Z]{2}$"
          },
          "startAt": {
            "type": "string",
            "format": "date-time",
            "description": "UTC timestamp aligned to PostgreSQL microsecond precision."
          },
          "endAt": {
            "type": "string",
            "format": "date-time",
            "description": "UTC timestamp aligned to PostgreSQL microsecond precision."
          },
          "offlineAllowed": {
            "type": "boolean"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "Page": {
        "type": "object",
        "required": [
          "items"
        ],
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/Item"
            }
          },
          "nextCursor": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          }
        }
      },
      "Version": {
        "type": "object",
        "required": [
          "version",
          "assetVersion",
          "locale"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "assetVersion": {
            "type": "integer",
            "minimum": 1
          },
          "locale": {
            "type": "string",
            "maxLength": 35
          }
        }
      },
      "Check": {
        "type": "object",
        "required": [
          "contentId",
          "country",
          "maturity"
        ],
        "properties": {
          "contentId": {
            "type": "string",
            "format": "uuid"
          },
          "country": {
            "type": "string",
            "pattern": "^[A-Z]{2}$"
          },
          "maturity": {
            "type": "integer",
            "minimum": 0,
            "maximum": 18
          },
          "offline": {
            "type": "boolean",
            "default": false
          }
        }
      },
      "Decision": {
        "type": "object",
        "required": [
          "allowed",
          "code",
          "offlineAllowed",
          "maturity"
        ],
        "properties": {
          "allowed": {
            "type": "boolean"
          },
          "code": {
            "type": "string"
          },
          "expiresAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "offlineAllowed": {
            "type": "boolean"
          },
          "originPrefix": {
            "type": [
              "string",
              "null"
            ]
          },
          "maturity": {
            "type": "integer"
          }
        }
      },
      "Problem": {
        "type": "object",
        "required": [
          "type",
          "title",
          "status",
          "code"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "code": {
            "type": "string"
          },
          "detail": {
            "type": "string"
          }
        }
      },
      "Create": {
        "type": "object",
        "required": [
          "type",
          "maturity",
          "locale",
          "title",
          "synopsis"
        ],
        "properties": {
          "parentId": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "type": {
            "type": "string",
            "enum": [
              "MOVIE",
              "SERIES",
              "SEASON",
              "EPISODE",
              "SPORT"
            ]
          },
          "maturity": {
            "type": "integer",
            "minimum": 0,
            "maximum": 18
          },
          "locale": {
            "type": "string",
            "maxLength": 35
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "synopsis": {
            "type": "string",
            "maxLength": 4000
          }
        }
      },
      "Localization": {
        "type": "object",
        "required": [
          "locale",
          "title",
          "synopsis",
          "version"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "locale": {
            "type": "string",
            "maxLength": 35
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "synopsis": {
            "type": "string",
            "maxLength": 4000
          }
        }
      },
      "Grant": {
        "type": "object",
        "required": [
          "country",
          "startAt",
          "endAt"
        ],
        "properties": {
          "country": {
            "type": "string",
            "pattern": "^[A-Z]{2}$"
          },
          "startAt": {
            "type": "string",
            "format": "date-time",
            "description": "UTC timestamp aligned to PostgreSQL microsecond precision."
          },
          "endAt": {
            "type": "string",
            "format": "date-time",
            "description": "UTC timestamp aligned to PostgreSQL microsecond precision."
          },
          "offlineAllowed": {
            "type": "boolean"
          }
        }
      },
      "Revision": {
        "type": "object",
        "required": [
          "version",
          "locale"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "locale": {
            "type": "string",
            "minLength": 1,
            "maxLength": 35
          }
        }
      },
      "Localized": {
        "type": "object",
        "properties": {
          "title": {
            "type": "string",
            "maxLength": 200
          },
          "synopsis": {
            "type": "string",
            "maxLength": 4000
          }
        },
        "required": [
          "title",
          "synopsis"
        ]
      },
      "Snapshot": {
        "type": "object",
        "properties": {
          "contentId": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "contentType": {
            "type": "string"
          },
          "maturity": {
            "type": "integer",
            "minimum": 0,
            "maximum": 18
          },
          "localizations": {
            "type": "object",
            "additionalProperties": {
              "$ref": "#/components/schemas/Localized"
            }
          },
          "genres": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "maxItems": 10
          },
          "actors": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "maxItems": 20
          },
          "releaseDate": {
            "type": [
              "string",
              "null"
            ],
            "format": "date"
          },
          "publishedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "contentId",
          "version",
          "contentType",
          "maturity",
          "localizations",
          "genres",
          "actors",
          "releaseDate",
          "publishedAt"
        ]
      },
      "Taxonomy": {
        "type": "object",
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "genres": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^[a-z0-9][a-z0-9-]{0,39}$"
            },
            "maxItems": 10,
            "uniqueItems": true
          },
          "actors": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 120
            },
            "maxItems": 20,
            "uniqueItems": true
          },
          "releaseDate": {
            "type": [
              "string",
              "null"
            ],
            "format": "date"
          },
          "locale": {
            "type": "string"
          }
        },
        "required": [
          "version",
          "genres",
          "actors",
          "locale"
        ]
      },
      "BatchRights": {
        "type": "object",
        "properties": {
          "contentIds": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "maxItems": 100
          },
          "country": {
            "type": "string",
            "pattern": "^[A-Z]{2}$"
          },
          "maturity": {
            "type": "integer",
            "minimum": 0,
            "maximum": 18
          }
        },
        "required": [
          "contentIds",
          "country",
          "maturity"
        ]
      },
      "LiveFixture": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "contentId": {
            "type": "string",
            "format": "uuid"
          },
          "league": {
            "type": "string"
          },
          "homeTeam": {
            "type": "string"
          },
          "awayTeam": {
            "type": "string"
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          },
          "state": {
            "type": "string",
            "enum": [
              "SCHEDULED",
              "READY",
              "LIVE",
              "ENDED",
              "ARCHIVED",
              "CANCELLED"
            ]
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "dvrSeconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 7200
          },
          "sourceAvailable": {
            "type": "boolean"
          },
          "commentaries": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "language": {
                  "type": "string"
                },
                "label": {
                  "type": "string"
                }
              },
              "required": [
                "language",
                "label"
              ]
            }
          },
          "subtitles": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "replayContentId": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          }
        },
        "required": [
          "id",
          "contentId",
          "league",
          "homeTeam",
          "awayTeam",
          "startsAt",
          "endsAt",
          "state",
          "version",
          "dvrSeconds",
          "sourceAvailable",
          "commentaries",
          "subtitles",
          "replayContentId"
        ]
      },
      "LiveEvent": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "contentId": {
            "type": "string",
            "format": "uuid"
          },
          "league": {
            "type": "string"
          },
          "homeTeam": {
            "type": "string"
          },
          "awayTeam": {
            "type": "string"
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          },
          "state": {
            "type": "string",
            "enum": [
              "SCHEDULED",
              "READY",
              "LIVE",
              "ENDED",
              "ARCHIVED",
              "CANCELLED"
            ]
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "dvrSeconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 7200
          },
          "commentaries": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "language": {
                  "type": "string"
                },
                "label": {
                  "type": "string"
                }
              },
              "required": [
                "language",
                "label"
              ]
            }
          },
          "subtitles": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "replayContentId": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "referenceCountry": {
            "type": "string"
          },
          "feedEpoch": {
            "type": "integer",
            "minimum": 1
          },
          "packagerSubject": {
            "type": "string"
          },
          "feedSequence": {
            "type": "integer",
            "minimum": 0
          },
          "healthy": {
            "type": "boolean"
          },
          "sealed": {
            "type": "boolean"
          },
          "firstSegmentAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "lastSegmentAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "healthReceivedAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "manifestSha": {
            "type": [
              "string",
              "null"
            ]
          },
          "endedAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "contentId",
          "league",
          "homeTeam",
          "awayTeam",
          "startsAt",
          "endsAt",
          "state",
          "version",
          "dvrSeconds",
          "commentaries",
          "subtitles",
          "replayContentId",
          "referenceCountry",
          "feedEpoch",
          "packagerSubject",
          "feedSequence",
          "healthy",
          "sealed",
          "firstSegmentAt",
          "lastSegmentAt",
          "healthReceivedAt",
          "manifestSha",
          "endedAt"
        ]
      },
      "LiveCommand": {
        "type": "object",
        "properties": {
          "event": {
            "$ref": "#/components/schemas/LiveEvent"
          },
          "duplicate": {
            "type": "boolean"
          }
        },
        "required": [
          "event",
          "duplicate"
        ]
      },
      "LiveHighlight": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "contentId": {
            "type": "string",
            "format": "uuid"
          },
          "label": {
            "type": "string"
          },
          "startMillis": {
            "type": "integer",
            "minimum": 0
          },
          "endMillis": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
          "id",
          "contentId",
          "label",
          "startMillis",
          "endMillis"
        ]
      },
      "LiveDecision": {
        "type": "object",
        "properties": {
          "allowed": {
            "type": "boolean"
          },
          "code": {
            "type": "string"
          },
          "contentId": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          },
          "expiresAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "originPrefix": {
            "type": [
              "string",
              "null"
            ]
          },
          "maturity": {
            "type": "integer"
          },
          "dvrFrom": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "dvrUntil": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        },
        "required": [
          "allowed",
          "code",
          "contentId",
          "expiresAt",
          "originPrefix",
          "maturity",
          "dvrFrom",
          "dvrUntil"
        ]
      }
    },
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    }
  },
  "paths": {
    "/v1/catalog": {
      "get": {
        "operationId": "browseCatalog",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "description": "Published snapshots only; metadata visibility is not playback authorization.",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Page"
                }
              }
            }
          },
          "400": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "locale",
            "in": "query",
            "schema": {
              "type": "string",
              "default": "en"
            }
          },
          {
            "name": "type",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "MOVIE",
                "SERIES",
                "SEASON",
                "EPISODE",
                "SPORT"
              ]
            }
          },
          {
            "name": "after",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "default": 20,
              "minimum": 1,
              "maximum": 100
            }
          }
        ]
      }
    },
    "/v1/catalog/{id}": {
      "get": {
        "operationId": "getPublishedCatalog",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "description": "",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Item"
                }
              }
            }
          },
          "400": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "403": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "locale",
            "in": "query",
            "schema": {
              "type": "string",
              "default": "en"
            }
          }
        ]
      }
    },
    "/v1/admin/catalog": {
      "post": {
        "operationId": "createDraft",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "description": "catalog.write scope",
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Item"
                }
              }
            }
          },
          "400": {
            "description": "Rejection or dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "Rejection or dependency unavailable",
            "content": {
