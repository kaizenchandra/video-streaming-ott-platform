{
  "openapi": "3.1.0",
  "info": {
    "title": "OTT Operations API",
    "version": "0.1.0"
  },
  "servers": [
    {
      "url": "http://localhost:8090"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Problem": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 100,
            "maximum": 599
          },
          "detail": {
            "type": "string"
          },
          "code": {
            "type": "string"
          }
        }
      },
      "SupportRequest": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string",
            "format": "uuid"
          },
          "accountId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "requestId",
          "accountId"
        ]
      },
      "Case": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "accountId": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "OPEN",
              "RESOLVED"
            ]
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Action": {
        "type": "object",
        "properties": {
          "operationId": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "action": {
            "type": "string",
            "enum": [
              "SUSPEND_ACCOUNT",
              "RESUME_ACCOUNT",
              "REVOKE_ENTITLEMENT",
              "RESTORE_ENTITLEMENT"
            ]
          }
        },
        "required": [
          "operationId",
          "version",
          "action"
        ]
      },
      "Version": {
        "type": "object",
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
          "version"
        ]
      },
      "Command": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "caseId": {
            "type": "string",
            "format": "uuid"
          },
          "accountId": {
            "type": "string",
            "format": "uuid"
          },
          "action": {
            "type": "string"
          },
          "reason": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "enum": [
              "PENDING",
              "RUNNING",
              "RETRY",
              "APPLIED",
              "REJECTED",
              "RECONCILE"
            ]
          },
          "attempts": {
            "type": "integer",
            "minimum": 0
          },
          "ownerVersion": {
            "type": [
              "integer",
              "null"
            ]
          },
          "resultCode": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "Signal": {
        "type": "object",
        "properties": {
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "accountId": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string",
            "enum": [
              "LOGIN_FAILURE",
              "DEVICE_LIMIT",
              "STREAM_LIMIT",
              "GEO_CHANGE"
            ]
          },
          "region": {
            "type": "string",
            "pattern": "^([A-Z]{2}|UNKNOWN)$"
          },
          "occurredAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "eventId",
          "accountId",
          "kind",
          "region",
          "occurredAt"
        ]
      },
      "SignalReceipt": {
        "type": "object",
        "properties": {
          "accepted": {
            "type": "boolean"
          },
          "duplicate": {
            "type": "boolean"
          },
          "ignored": {
            "type": "boolean"
          }
        }
      }
    }
  },
