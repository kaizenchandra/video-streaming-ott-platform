{
  "openapi": "3.1.0",
  "info": {
    "title": "OTT Commerce API",
    "version": "0.1.0",
    "description": "Initial fixed-duration prepaid billing, single configured payment provider. Commercial recurring mandates, refunds/tax/proration require provider and business policy integration."
  },
  "servers": [
    {
      "url": "http://localhost:8083"
    }
  ],
  "components": {
    "schemas": {
      "Plan": {
        "type": "object",
        "required": [
          "id",
          "name",
          "priceMinor",
          "currency",
          "durationDays",
          "maxStreams",
          "adSupported",
          "offlineAllowed"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "priceMinor": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 1000000000
          },
          "currency": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "durationDays": {
            "type": "integer",
            "minimum": 1,
            "maximum": 3650
          },
          "maxStreams": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10
          },
          "adSupported": {
            "type": "boolean"
          },
          "offlineAllowed": {
            "type": "boolean"
          }
        }
      },
      "Purchase": {
        "type": "object",
        "required": [
          "planId"
        ],
        "properties": {
          "planId": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "Order": {
        "type": "object",
        "required": [
          "id",
          "accountId",
          "planId",
          "priceMinor",
          "currency",
          "state"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "accountId": {
            "type": "string",
            "format": "uuid"
          },
          "planId": {
            "type": "string",
            "format": "uuid"
          },
          "priceMinor": {
            "type": "integer",
            "format": "int64"
          },
          "currency": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "enum": [
              "CREATED",
              "PENDING",
              "PENDING_RECONCILIATION",
              "PAID",
              "FAILED"
            ]
          },
          "providerRef": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "Entitlement": {
        "type": "object",
        "required": [
          "active",
          "maxStreams",
          "adSupported",
          "offlineAllowed",
          "version"
        ],
        "properties": {
          "active": {
            "type": "boolean"
          },
          "expiresAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "maxStreams": {
            "type": "integer",
            "minimum": 0,
            "maximum": 10
          },
          "adSupported": {
            "type": "boolean"
          },
          "offlineAllowed": {
            "type": "boolean"
          },
          "version": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Invoice": {
        "type": "object",
        "required": [
          "orderId",
          "amountMinor",
          "currency",
          "paidAt"
        ],
        "properties": {
          "orderId": {
            "type": "string",
            "format": "uuid"
          },
          "amountMinor": {
            "type": "integer",
            "format": "int64"
          },
          "currency": {
            "type": "string"
          },
          "paidAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Webhook": {
        "type": "object",
        "required": [
          "eventId",
          "orderId",
          "providerRef",
          "amountMinor",
          "currency",
          "outcome"
        ],
        "properties": {
          "eventId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{8,128}$"
          },
          "orderId": {
            "type": "string",
            "format": "uuid"
          },
          "providerRef": {
            "type": "string",
            "maxLength": 200
          },
          "amountMinor": {
            "type": "integer",
            "format": "int64"
          },
          "currency": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "outcome": {
            "type": "string",
            "enum": [
              "SUCCEEDED",
              "FAILED"
            ]
          }
        }
      },
      "Problem": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 100,
            "maximum": 599
          },
          "detail": {
            "type": "string"
          },
          "code": {
            "type": "string"
          }
        }
      },
      "PlanInput": {
        "type": "object",
        "required": [
          "name",
          "priceMinor",
          "currency",
          "durationDays",
          "maxStreams"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "priceMinor": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 1000000000
          },
          "currency": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "durationDays": {
            "type": "integer",
            "minimum": 1,
            "maximum": 3650
          },
          "maxStreams": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10
          },
          "adSupported": {
            "type": "boolean"
          },
          "offlineAllowed": {
            "type": "boolean"
          }
        }
      },
      "CommerceSecurityCommand": {
        "type": "object",
        "properties": {
          "operationId": {
            "type": "string",
            "format": "uuid"
          },
          "accountId": {
            "type": "string",
            "format": "uuid"
          },
          "action": {
            "type": "string",
            "enum": [
              "REVOKE",
              "RESTORE"
            ]
          },
          "reason": {
            "type": "string",
            "enum": [
              "CREDENTIAL_ABUSE",
              "STREAM_ABUSE",
              "PAYMENT_RISK",
              "SUPPORT_REVIEW"
            ]
          }
        },
        "required": [
          "operationId",
          "accountId",
          "action",
          "reason"
        ]
      },
      "CommerceSecurityResult": {
        "type": "object",
        "properties": {
          "operationId": {
            "type": "string",
            "format": "uuid"
          },
          "accountId": {
            "type": "string",
            "format": "uuid"
          },
          "active": {
            "type": "boolean"
          },
          "version": {
            "type": "integer",
            "minimum": 0
          }
        }
      }
    },
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    }
  },
