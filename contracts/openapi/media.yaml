{
  "openapi": "3.1.0",
  "info": {
    "title": "OTT Media Ingestion",
    "version": "0.1.0",
    "description": "Bounded private presigned MP4 upload, recoverable Temporal processing, validated immutable HLS/DASH/CMAF publication and typed outbox. Current local protection mode is mock-clear."
  },
  "servers": [
    {
      "url": "http://localhost:8086"
    }
  ],
  "components": {
    "schemas": {},
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    }
  },
  "paths": {
    "/v1/admin/media/uploads": {
      "post": {
        "summary": "Allocate private immutable S3 single-PUT upload; size/checksum fixed, expiry10min",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Job or scoped upload; never media bytes"
          },
          "400": {
            "description": "Invalid input"
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "media.write required"
          },
          "404": {
            "description": "Job not found"
          },
          "409": {
            "description": "Upload/state/idempotency conflict"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "contentId",
                  "assetVersion",
                  "bytes",
                  "sha256"
                ],
                "properties": {
                  "contentId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "assetVersion": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "bytes": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 268435456
                  },
                  "sha256": {
                    "type": "string",
                    "pattern": "^[a-f0-9]{64}$"
                  },
                  "encodingProfile": {
                    "type": "string",
                    "enum": [
                      "VOD",
                      "SPORT"
                    ],
                    "default": "VOD"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/admin/media/jobs/{id}": {
      "get": {
        "summary": "Inspect durable job state",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Job or scoped upload; never media bytes"
          },
          "400": {
            "description": "Invalid input"
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "media.write required"
          },
          "404": {
            "description": "Job not found"
          },
          "409": {
            "description": "Upload/state/idempotency conflict"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    },
    "/v1/admin/media/jobs/{id}/upload-completed": {
      "post": {
        "summary": "Verify S3 HEAD size/checksum and queue durable workflow dispatch",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Job or scoped upload; never media bytes"
          },
          "400": {
            "description": "Invalid input"
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "media.write required"
          },
          "404": {
            "description": "Job not found"
          },
          "409": {
            "description": "Upload/state/idempotency conflict"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    }
  }
}
