  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Account": {
        "type": "object",
        "required": [
          "id",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Profile": {
        "type": "object",
        "required": [
          "id",
          "name",
          "kids",
          "maturity",
          "locale",
          "version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "kids": {
            "type": "boolean"
          },
          "maturity": {
            "type": "integer",
            "minimum": 0,
            "maximum": 18
          },
          "locale": {
            "type": "string",
            "minLength": 1,
            "maxLength": 35
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        }
      },
      "Device": {
        "type": "object",
        "required": [
          "id",
          "installationId",
          "name",
          "codecs",
          "drm",
          "status",
          "version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "installationId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{8,128}$"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "codecs": {
            "type": "array",
            "minItems": 1,
            "maxItems": 3,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "enum": [
                "H264",
                "HEVC",
                "AV1"
              ]
            }
          },
          "drm": {
            "type": "array",
            "maxItems": 3,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "enum": [
                "WIDEVINE",
                "FAIRPLAY",
                "PLAYREADY"
              ]
            }
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "REVOKED"
            ]
          },
          "version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "Problem": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 100,
            "maximum": 599
          },
          "detail": {
            "type": "string"
          },
          "code": {
            "type": "string"
          }
        }
      },
      "EligibilityQuery": {
        "type": "object",
        "required": [
          "accountId",
          "profileId",
          "deviceId"
        ],
        "properties": {
          "accountId": {
            "type": "string",
            "format": "uuid"
          },
          "profileId": {
            "type": "string",
            "format": "uuid"
          },
          "deviceId": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "Eligibility": {
        "type": "object",
        "required": [
          "allowed",
          "maturity",
          "kids"
        ],
        "properties": {
          "allowed": {
            "type": "boolean"
          },
          "maturity": {
            "type": "integer",
            "minimum": 0,
            "maximum": 18
          },
          "kids": {
            "type": "boolean"
          }
        }
      },
      "ProfileInput": {
        "type": "object",
        "required": [
          "name",
          "kids",
          "maturity",
          "locale"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "kids": {
            "type": "boolean"
          },
          "maturity": {
            "type": "integer",
            "minimum": 0,
            "maximum": 18
          },
          "locale": {
            "type": "string",
            "minLength": 1,
            "maxLength": 35
          },
          "version": {
            "type": "integer",
            "minimum": 0,
            "description": "Required current version on update; absent/zero on create."
          }
        }
      },
      "DeviceInput": {
        "type": "object",
        "required": [
          "installationId",
          "name",
          "codecs",
          "drm"
        ],
        "properties": {
          "installationId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{8,128}$"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "codecs": {
            "type": "array",
            "minItems": 1,
            "maxItems": 3,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "enum": [
                "H264",
                "HEVC",
                "AV1"
              ]
            }
          },
          "drm": {
            "type": "array",
            "maxItems": 3,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "enum": [
                "WIDEVINE",
                "FAIRPLAY",
                "PLAYREADY"
              ]
            }
          }
        }
      },
      "ParentalStatus": {
        "type": "object",
        "properties": {
          "enabled": {
            "type": "boolean"
          },
          "version": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "ParentalConfiguration": {
        "type": "object",
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 0
          },
          "currentPin": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^[0-9]{4,8}$"
          },
          "newPin": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^[0-9]{4,8}$"
          }
        },
        "required": [
          "version"
        ]
      },
      "ProfileSelectionRequest": {
        "type": "object",
        "properties": {
          "profileId": {
            "type": "string",
            "format": "uuid"
          },
          "deviceId": {
            "type": "string",
            "format": "uuid"
          },
          "pin": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^[0-9]{4,8}$"
          }
        },
        "required": [
          "profileId",
          "deviceId"
        ]
      },
      "ProfileSelectionGrant": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{43}$"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "MemberSecurityCommand": {
        "type": "object",
        "properties": {
          "operationId": {
            "type": "string",
            "format": "uuid"
          },
          "accountId": {
            "type": "string",
            "format": "uuid"
          },
          "action": {
            "type": "string",
            "enum": [
              "SUSPEND",
              "RESUME"
            ]
          },
          "reason": {
            "type": "string",
            "enum": [
              "CREDENTIAL_ABUSE",
              "STREAM_ABUSE",
              "PAYMENT_RISK",
              "SUPPORT_REVIEW"
            ]
          }
        },
        "required": [
          "operationId",
          "accountId",
          "action",
          "reason"
        ]
      },
      "MemberSecurityResult": {
        "type": "object",
        "properties": {
          "operationId": {
            "type": "string",
            "format": "uuid"
          },
          "accountId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "SUSPENDED"
            ]
          },
          "securityEpoch": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "IssuedQuery": {
        "type": "object",
        "properties": {
          "accountId": {
            "type": "string",
            "format": "uuid"
          },
          "profileId": {
            "type": "string",
            "format": "uuid"
          },
          "deviceId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "accountId",
          "profileId",
          "deviceId"
        ]
      },
      "IssuedEligibility": {
        "type": "object",
        "properties": {
          "allowed": {
            "type": "boolean"
          },
          "maturity": {
            "type": "integer",
            "minimum": 0,
            "maximum": 18
          },
          "kids": {
            "type": "boolean"
          },
          "securityEpoch": {
            "type": "integer",
            "minimum": 0
          }
        }
      }
    }
  }
}
