spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 100ms
      connect-timeout: 100ms
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: playback-service
  datasource:
    url: ${PLAYBACK_DB_URL}
    username: ${PLAYBACK_DB_USER}
    password: ${PLAYBACK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 1000
      connection-init-sql: "SET statement_timeout = '2s'; SET lock_timeout = '500ms'"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 5000
        request.timeout.ms: 2000
        linger.ms: 5
        max.block.ms: 2000
  flyway:
    enabled: true
    locations: classpath:db/playback
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: 8084
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 256KB
    threads:
      max: 100
    accept-count: 64
ott:
  providers:
    mode: ${PLAYBACK_PROVIDERS:unconfigured}
  token:
    secret: ${PLAYBACK_TOKEN_SECRET}
  geo:
    secret: ${GEO_ASSERTION_SECRET}
  owners:
    member: ${MEMBER_URL:http://localhost:8081}
    content: ${CONTENT_URL:http://localhost:8082}
    commerce: ${COMMERCE_URL:http://localhost:8083}
  workload:
    token-url: ${WORKLOAD_TOKEN_URL}
    client-id: ${WORKLOAD_CLIENT_ID}
    client-secret: ${WORKLOAD_CLIENT_SECRET}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
  schema-registry:
    url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
  security:
    issuer: ${OIDC_ISSUER}
    jwks-uri: ${OIDC_JWKS_URL}
    audience: ${OIDC_AUDIENCE:ott-api}
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 3s
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  structured:
    format:
      console: ecs
