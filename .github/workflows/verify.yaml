name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python3 scripts/architecture_check.py
      - run: python3 scripts/security_check.py
      - run: mvn --batch-mode -Pintegration,sbom verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            **/target/*-reports/
            **/target/classes/META-INF/sbom/application.cdx.json
