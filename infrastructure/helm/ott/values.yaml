{
  "mode": "local",
  "replicas": 3,
  "imagePullPolicy": "IfNotPresent",
  "externalEgressCidrs": [],
  "externalEgressPorts": [
    443,
    5432,
    6379,
    9096,
    7233
  ],
  "sharedEnv": {
    "OIDC_AUDIENCE": "ott-api",
    "KAFKA_BOOTSTRAP_SERVERS": "kafka:9092",
    "SCHEMA_REGISTRY_URL": "http://schema-registry:8081",
    "MEMBER_URL": "http://ott-member:8080",
    "CONTENT_URL": "http://ott-content:8080",
    "COMMERCE_URL": "http://ott-commerce:8080",
    "PLAYBACK_URL": "http://ott-playback:8080"
  },
  "resources": {
    "requests": {
      "cpu": "250m",
      "memory": "512Mi"
    },
    "limits": {
      "cpu": "1",
      "memory": "1Gi"
    }
  },
  "autoscaling": {
    "enabled": false,
    "minReplicas": 3,
    "maxReplicas": 10,
    "cpu": 60
  },
  "ingress": {
    "enabled": false,
    "className": "alb",
    "host": "",
    "tlsSecret": "",
    "certificateArn": "",
    "wafAclArn": ""
  },
  "owners": {
    "member": {
      "enabled": true,
      "image": "ott-member:local",
      "secretName": "ott-member",
      "migrationSecretName": "ott-member-migration",
      "roleArn": "",
      "env": {}
    },
    "content": {
      "enabled": true,
      "image": "ott-content:local",
      "secretName": "ott-content",
      "migrationSecretName": "ott-content-migration",
      "roleArn": "",
      "env": {}
    },
    "commerce": {
      "enabled": true,
      "image": "ott-commerce:local",
      "secretName": "ott-commerce",
      "migrationSecretName": "ott-commerce-migration",
      "roleArn": "",
      "env": {
        "PAYMENT_MODE": "mock"
      }
    },
    "playback": {
      "enabled": true,
      "image": "ott-playback:local",
      "secretName": "ott-playback",
      "migrationSecretName": "ott-playback-migration",
      "roleArn": "",
      "env": {
        "PLAYBACK_PROVIDERS": "mock"
      }
    },
    "media": {
      "enabled": true,
      "image": "ott-media:local",
      "secretName": "ott-media",
      "migrationSecretName": "ott-media-migration",
      "roleArn": "",
      "env": {
        "MEDIA_PROTECTION": "MOCK_CLEAR_ONLY"
      }
    },
    "experience": {
      "enabled": true,
      "image": "ott-experience:local",
      "secretName": "ott-experience",
      "migrationSecretName": "ott-experience-migration",
      "roleArn": "",
      "env": {}
    },
    "engagement": {
      "enabled": true,
      "image": "ott-engagement:local",
      "secretName": "ott-engagement",
      "migrationSecretName": "ott-engagement-migration",
      "roleArn": "",
      "env": {}
    },
    "insights": {
      "enabled": true,
      "image": "ott-insights:local",
      "secretName": "ott-insights",
      "migrationSecretName": "ott-insights-migration",
      "roleArn": "",
      "env": {}
    },
    "operations": {
      "enabled": true,
      "image": "ott-operations:local",
      "secretName": "ott-operations",
      "migrationSecretName": "ott-operations-migration",
      "roleArn": "",
      "env": {}
    }
  },
  "worker": {
    "enabled": false,
    "image": "ott-media-worker:local",
    "secretName": "ott-media-worker",
    "roleArn": "",
    "replicas": 1,
    "env": {}
  },
  "migrations": {
    "enabled": false
  },
  "routes": [
    {
      "path": "/v1/admin/media/jobs/*/upload-completed",
      "owner": "media"
    },
    {
      "path": "/v1/admin/live/events/*/transitions",
      "owner": "content"
    },
    {
      "path": "/v1/admin/live/events/*/highlights",
      "owner": "content"
    },
    {
      "path": "/v1/admin/catalog/*/localizations",
      "owner": "content"
    },
    {
      "path": "/v1/playback/sessions/*/heartbeat",
      "owner": "playback"
    },
    {
      "path": "/v1/admin/insights/experiments/*",
      "owner": "insights"
    },
    {
