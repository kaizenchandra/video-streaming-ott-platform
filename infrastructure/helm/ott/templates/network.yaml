apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-default-deny}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: ott}}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-dependencies}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: ott}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/part-of: ott}}}]
      ports: [{port: 8080, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {ott-ingress: "true"}}
      ports: [{port: 8080, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {ott-monitoring: "true"}}
      ports: [{port: 8080, protocol: TCP}, {port: 8091, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/part-of: ott}}}]
      ports: [{port: 8080, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {ott-dependencies: "true"}}
      ports:
        {{- range .Values.externalEgressPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
    {{- if .Values.externalEgressCidrs }}
    - to:
        {{- range .Values.externalEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        {{- range .Values.externalEgressPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
    {{- end }}
